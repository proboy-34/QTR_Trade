services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qtr
      POSTGRES_USER: qtr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qtr_local_only}
    volumes: [qtr_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U qtr"], interval: 5s, timeout: 3s, retries: 15}
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://qtr:${POSTGRES_PASSWORD:-qtr_local_only}@db:5432/qtr
      TRADING_MODE: paper
      LIVE_TRADING_ENABLED: "false"
      DEMO_MODE: "false"
      EXECUTION_MODE: paper
    depends_on: {db: {condition: service_healthy}}
    ports: ["8000:8000"]
  web:
    build: ./frontend
    depends_on: [api]
    ports: ["5173:80"]
volumes: {qtr_data: {}}

